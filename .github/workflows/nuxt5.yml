name: Nuxt 5 prototype

on:
  push:
    branches:
      - nuxt5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuxt5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Fork integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Nuxt Endpoints
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.20.0
          cache: false
          run-install: false

      - name: Checkout pinned route-contract prototypes
        run: |
          mkdir -p ../upstream
          git clone --depth 1 --branch prototype/route-contracts https://github.com/nuxt-endpoints/fetchdts.git ../upstream/fetchdts
          git clone --depth 1 --branch prototype/route-contracts https://github.com/nuxt-endpoints/h3.git ../upstream/h3
          git clone --depth 1 --branch prototype/route-contracts https://github.com/nuxt-endpoints/nitro.git ../upstream/nitro
          git clone --depth 1 --branch prototype/route-metadata https://github.com/nuxt-endpoints/nuxt.git ../upstream/nuxt
          git -C ../upstream/fetchdts fetch --depth 1 origin de56ae24aea700c0ec2b26f8b56811fdd8940a63
          git -C ../upstream/h3 fetch --depth 1 origin efdaeb06d71a5f470256f71d600324fcab75a9a2
          git -C ../upstream/nitro fetch --depth 1 origin 83f2000389a533edb3859f6e1c2244ee55032c48
          git -C ../upstream/nuxt fetch --depth 1 origin 8aba1274d8fbc3d1b0c603dd5b9cb23d555f395c
          git -C ../upstream/fetchdts checkout --detach de56ae24aea700c0ec2b26f8b56811fdd8940a63
          git -C ../upstream/h3 checkout --detach efdaeb06d71a5f470256f71d600324fcab75a9a2
          git -C ../upstream/nitro checkout --detach 83f2000389a533edb3859f6e1c2244ee55032c48
          git -C ../upstream/nuxt checkout --detach 8aba1274d8fbc3d1b0c603dd5b9cb23d555f395c
          test "$(git -C ../upstream/fetchdts rev-parse HEAD)" = de56ae24aea700c0ec2b26f8b56811fdd8940a63
          test "$(git -C ../upstream/h3 rev-parse HEAD)" = efdaeb06d71a5f470256f71d600324fcab75a9a2
          test "$(git -C ../upstream/nitro rev-parse HEAD)" = 83f2000389a533edb3859f6e1c2244ee55032c48
          test "$(git -C ../upstream/nuxt rev-parse HEAD)" = 8aba1274d8fbc3d1b0c603dd5b9cb23d555f395c

      - name: Build fetchdts prototype
        working-directory: ../upstream/fetchdts
        run: vp install --frozen-lockfile && vp run build

      - name: Build H3 prototype
        working-directory: ../upstream/h3
        run: vp install --frozen-lockfile && vp run build

      - name: Build Nitro prototype
        working-directory: ../upstream/nitro
        run: vp install --frozen-lockfile && vp run build

      - name: Pack Nuxt prototype
        run: |
          cd ../upstream/nuxt
          vp install --frozen-lockfile
          cd "$GITHUB_WORKSPACE"
          vp run prepare:nuxt5-fork

      - name: Install Nuxt Endpoints
        run: vp install --frozen-lockfile

      - name: Prepare module development files
        run: vp run dev:prepare

      - name: Check Nuxt 5 integration
        run: vp run check

      # `vp run check` gates the browser flows off, so without this step the
      # Pinia Colada hydrate/mutate/replay scenarios only ever run locally.
      - name: Install Chromium for browser E2E
        run: vp run test:e2e:browser:install

      - name: Browser E2E
        run: vp run test:e2e:browser

      - name: Build Nuxt Endpoints
        run: vp run build
