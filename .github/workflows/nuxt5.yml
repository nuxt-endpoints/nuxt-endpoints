name: Nuxt 5 prototype

on:
  push:
    branches:
      - nuxt5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuxt5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Fork integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Nuxt Endpoints
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.20.0
          cache: false
          run-install: false

      - name: Checkout pinned route-contract prototypes
        run: |
          mkdir -p .upstream
          git clone --depth 1 --branch prototype/route-contracts https://github.com/nuxt-endpoints/fetchdts.git .upstream/fetchdts
          git clone --depth 1 --branch prototype/route-contracts https://github.com/nuxt-endpoints/h3.git .upstream/h3
          git clone --depth 1 --branch prototype/route-contracts https://github.com/nuxt-endpoints/nitro.git .upstream/nitro
          git clone --depth 1 --branch prototype/route-metadata https://github.com/nuxt-endpoints/nuxt.git .upstream/nuxt
          git -C .upstream/fetchdts fetch --depth 1 origin de56ae24aea700c0ec2b26f8b56811fdd8940a63
          git -C .upstream/h3 fetch --depth 1 origin 7f4c1c901a15e2a6ac5c217a20fb638a740240f4
          git -C .upstream/nitro fetch --depth 1 origin cc9f56fcf2cc1bc8b19d1c81408853df8b1c7b07
          git -C .upstream/nuxt fetch --depth 1 origin d9dab5edf132eb2ba7882966ff21e6ca1c427a32
          git -C .upstream/fetchdts checkout --detach de56ae24aea700c0ec2b26f8b56811fdd8940a63
          git -C .upstream/h3 checkout --detach 7f4c1c901a15e2a6ac5c217a20fb638a740240f4
          git -C .upstream/nitro checkout --detach cc9f56fcf2cc1bc8b19d1c81408853df8b1c7b07
          git -C .upstream/nuxt checkout --detach d9dab5edf132eb2ba7882966ff21e6ca1c427a32
          test "$(git -C .upstream/fetchdts rev-parse HEAD)" = de56ae24aea700c0ec2b26f8b56811fdd8940a63
          test "$(git -C .upstream/h3 rev-parse HEAD)" = 7f4c1c901a15e2a6ac5c217a20fb638a740240f4
          test "$(git -C .upstream/nitro rev-parse HEAD)" = cc9f56fcf2cc1bc8b19d1c81408853df8b1c7b07
          test "$(git -C .upstream/nuxt rev-parse HEAD)" = d9dab5edf132eb2ba7882966ff21e6ca1c427a32

      - name: Build fetchdts prototype
        working-directory: .upstream/fetchdts
        run: vp install --frozen-lockfile && vp run build

      - name: Build H3 prototype
        working-directory: .upstream/h3
        # Corepack currently rejects H3's semver range in devEngines before
        # Vite+ can resolve it. Vite+ still performs the install and build.
        run: COREPACK_ENABLE_PROJECT_SPEC=0 vp install --frozen-lockfile && vp run build

      - name: Build Nitro prototype
        working-directory: .upstream/nitro
        # Nitro's build tooling needs the TypeScript Compiler API. The native
        # TypeScript 7 package does not provide a stable compatible API yet.
        run: |
          vp add -D typescript@npm:@typescript/typescript6@6.0.2
          vp run build

      - name: Pack Nuxt prototype
        working-directory: .upstream/nuxt
        run: |
          vp install --frozen-lockfile
          mkdir -p .prototype-pack
          for package in schema kit nitro-server vite-server vite nuxt; do
            (cd "packages/$package" && vp pm pack --pack-destination ../../.prototype-pack)
          done

      - name: Install Nuxt Endpoints
        # The six Nuxt packages are built and packed on this runner. Their
        # tarball bytes are platform-dependent, while their source commits and
        # dependency graph remain pinned above and in pnpm-lock.yaml.
        run: vp install --no-frozen-lockfile -- --update-checksums

      - name: Prepare module development files
        run: vp run dev:prepare

      - name: Check Nuxt 5 integration
        run: vp run check

      # `vp run check` gates the browser flows off, so without this step the
      # Pinia Colada hydrate/mutate/replay scenarios only ever run locally.
      - name: Install Chromium for browser E2E
        run: vp run test:e2e:browser:install

      - name: Browser E2E
        run: vp run test:e2e:browser

      - name: Build Nuxt Endpoints
        run: vp run build
