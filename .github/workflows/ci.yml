name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Prepare module development files
        run: vp run dev:prepare

      - name: Check
        run: vp run check

      - name: Install Chromium for browser E2E
        if: matrix.node-version == '22.19.0'
        run: vp run test:e2e:browser:install

      - name: Browser E2E
        if: matrix.node-version == '22.19.0'
        run: vp run test:e2e:browser 2>&1 | tee browser-e2e.log

      - name: Upload Browser E2E log
        if: always() && matrix.node-version == '22.19.0'
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-node-${{ matrix.node-version }}
          path: browser-e2e.log
          if-no-files-found: error

      - name: Build package
        run: vp run build

  site:
    name: Generate documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22.19.0
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate site
        run: vp run site:generate

  package-smoke:
    name: Packed package / Nuxt ${{ matrix.nuxt-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nuxt-version:
          - '4.5.0'
          - '^4.5.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22.19.0
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Pack package
        run: vp pm pack --out /tmp/nuxt-endpoints.tgz

      - name: Test packed artifact
        run: vp run test:package /tmp/nuxt-endpoints.tgz '${{ matrix.nuxt-version }}'
