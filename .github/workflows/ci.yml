name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.3
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Prepare module development files
        run: vp run dev:prepare

      - name: Check
        run: vp run check

      - name: Install Chromium for browser E2E
        if: matrix.node-version == '22.22.3'
        run: vp run test:e2e:browser:install

      - name: Browser E2E
        if: matrix.node-version == '22.22.3'
        run: vp run test:e2e:browser 2>&1 | tee browser-e2e.log

      - name: Upload Browser E2E log
        if: always() && matrix.node-version == '22.22.3'
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-node-${{ matrix.node-version }}
          path: browser-e2e.log
          if-no-files-found: error

      - name: Build package
        run: vp run build

  native-fetch:
    name: Native fetch / Nuxt ${{ matrix.nuxt-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nuxt-version:
          - '4.6.4'
          - '4.7.0'
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp add -D 'nuxt@${{ matrix.nuxt-version }}'
      - run: vp run test:fixture-types
      - run: vp run test:e2e:browser:install
      - run: NUXT_ENDPOINTS_NATIVE_E2E=1 vp exec vitest run test/integration/native-fetch.test.ts

  site:
    name: Generate documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22.22.3
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate site
        run: vp run site:generate

  nitro3:
    name: Nitro 3 / Nuxt 4.7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NITRO_VERSION: 3.0.261103-rc
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22.22.3
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Enable Nitro 3 in the integration fixtures
        run: |
          vp add -D "nitro@$NITRO_VERSION"
          for fixture in playground test/fixtures/basic test/fixtures/native-fetch test/fixtures/query-auto; do
            printf '{"private":true,"type":"module","dependencies":{"nitro":"%s"}}\n' "$NITRO_VERSION" > "$fixture/package.json"
          done
      - run: vp run test:fixture-types
      - run: vp run test:e2e:browser:install
      - run: NUXT_ENDPOINTS_NATIVE_E2E=1 vp run test:e2e:browser
      - run: vp pm pack --out /tmp/nuxt-endpoints-nitro3.tgz
      - run: vp run test:package /tmp/nuxt-endpoints-nitro3.tgz 4.7.0 "$NITRO_VERSION"

  package-smoke:
    name: Packed package / Nuxt ${{ matrix.nuxt-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - nuxt-version: '4.5.0'
            node-version: 22.19.0
          - nuxt-version: '^4.5.0'
            node-version: 22.22.3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 22.22.3
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Pack package
        run: vp pm pack --out /tmp/nuxt-endpoints.tgz

      - name: Test packed artifact
        run: |
          vp env install 'node@${{ matrix.node-version }}'
          vp env exec --node '${{ matrix.node-version }}' node scripts/smoke-packed-package.mjs /tmp/nuxt-endpoints.tgz '${{ matrix.nuxt-version }}'
